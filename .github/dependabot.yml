version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
      day: monday
      time: "02:00"
      timezone: Asia/Ho_Chi_Minh
    labels:
      - dependencies
      - security
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: gradle
    directory: /backend
    target-branch: dev
    schedule:
      interval: weekly
      day: monday
      time: "02:15"
      timezone: Asia/Ho_Chi_Minh
    labels:
      - dependencies
      - backend
    groups:
      backend-dependencies:
        patterns:
          - "*"

  - package-ecosystem: npm
    directory: /frontend
    target-branch: dev
    schedule:
      interval: weekly
      day: monday
      time: "02:30"
      timezone: Asia/Ho_Chi_Minh
    labels:
      - dependencies
      - frontend
    groups:
      frontend-dependencies:
        patterns:
          - "*"

  - package-ecosystem: terraform
    directory: /infra/modules/environment
    target-branch: dev
    schedule:
      interval: weekly
      day: monday
      time: "02:45"
      timezone: Asia/Ho_Chi_Minh
    labels:
      - dependencies
      - infrastructure
    groups:
      infrastructure-providers:
        patterns:
          - "*"

  - package-ecosystem: terraform
    directory: /infra/bootstrap/state
    target-branch: dev
    schedule:
      interval: weekly
      day: monday
      time: "03:00"
      timezone: Asia/Ho_Chi_Minh
    labels:
      - dependencies
      - infrastructure
    groups:
      state-bootstrap-providers:
        patterns:
          - "*"
