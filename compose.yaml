services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: gioitruyen
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-gioitruyen_local}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-gioitruyen_root_local}
      MYSQL_USER: ${MYSQL_USER:-gioitruyen}
      TZ: UTC
    ports:
      - "3306:3306"
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test:
        - CMD
        - mysqladmin
        - ping
        - -h
        - 127.0.0.1
        - -uroot
        - -p${MYSQL_ROOT_PASSWORD:-gioitruyen_root_local}
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - gioitruyen_mysql:/var/lib/mysql

volumes:
  gioitruyen_mysql:
