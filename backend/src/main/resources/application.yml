spring:
  application:
    name: ${APP_NAME:story-platform}
  lifecycle:
    timeout-per-shutdown-phase: 20s
  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://127.0.0.1:27017/story_platform?replicaSet=rs0}
      database: ${MONGODB_DATABASE:story_platform}
    redis:
      url: ${REDIS_URL:redis://127.0.0.1:6379}

server:
  address: ${API_HOST:127.0.0.1}
  port: ${API_PORT:8080}
  servlet:
    context-path: /api/v1
  shutdown: graceful
  error:
    include-message: never
    include-binding-errors: never
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true

logging:
  level:
    root: ${LOG_LEVEL:INFO}
