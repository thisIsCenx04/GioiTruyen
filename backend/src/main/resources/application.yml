spring:
  application:
    name: ${APP_NAME:story-platform}
  jackson:
    deserialization:
      fail-on-unknown-properties: true
  lifecycle:
    timeout-per-shutdown-phase: 20s
  mongodb:
    uri: ${MONGODB_URI:mongodb://127.0.0.1:27017/story_platform?replicaSet=rs0}
    database: ${MONGODB_DATABASE:story_platform}
  data:
    redis:
      url: ${REDIS_URL:redis://127.0.0.1:6379}
  mvc:
    problemdetails:
      enabled: true
  servlet:
    multipart:
      max-file-size: 2MB
      max-request-size: 2MB

server:
  address: ${API_HOST:127.0.0.1}
  port: ${API_PORT:8080}
  servlet:
    context-path: /api/v1
  shutdown: graceful
  error:
    include-message: never
    include-binding-errors: never
    include-stacktrace: never
  tomcat:
    max-http-form-post-size: 1MB
    max-swallow-size: 2MB

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
  tracing:
    sampling:
      probability: ${OTEL_TRACES_SAMPLING_PROBABILITY:0.1}
    export:
      otlp:
        enabled: ${OTEL_TRACES_EXPORT_ENABLED:false}
  opentelemetry:
    resource-attributes:
      deployment.environment: ${APP_ENV:local}
      service.version: ${APP_VERSION:dev}
    tracing:
      limits:
        max-attributes: 64
        max-attribute-value-length: 256
        max-events: 32
  otlp:
    metrics:
      export:
        enabled: ${OTEL_METRICS_EXPORT_ENABLED:false}
        step: ${OTEL_METRICS_EXPORT_INTERVAL:30s}

app:
  events:
    outbox:
      max-payload-bytes: ${OUTBOX_MAX_PAYLOAD_BYTES:65536}
      worker:
        enabled: ${OUTBOX_WORKER_ENABLED:false}
        batch-size: ${OUTBOX_WORKER_BATCH_SIZE:25}
        lease-duration: ${OUTBOX_WORKER_LEASE_DURATION:30s}
        poll-interval: ${OUTBOX_WORKER_POLL_INTERVAL:1s}
        max-attempts: ${OUTBOX_WORKER_MAX_ATTEMPTS:8}
        initial-backoff: ${OUTBOX_WORKER_INITIAL_BACKOFF:1s}
        max-backoff: ${OUTBOX_WORKER_MAX_BACKOFF:15m}
  mongodb:
    min-pool-size: ${MONGODB_MIN_POOL_SIZE:2}
    max-pool-size: ${MONGODB_MAX_POOL_SIZE:50}
    max-connecting: ${MONGODB_MAX_CONNECTING:4}
    max-wait-time: ${MONGODB_MAX_WAIT_TIME:2s}
    max-idle-time: ${MONGODB_MAX_IDLE_TIME:60s}
    connect-timeout: ${MONGODB_CONNECT_TIMEOUT:2s}
    read-timeout: ${MONGODB_READ_TIMEOUT:5s}
    server-selection-timeout: ${MONGODB_SERVER_SELECTION_TIMEOUT:3s}
    write-timeout: ${MONGODB_WRITE_TIMEOUT:5s}
    migrations:
      enabled: ${MONGODB_MIGRATIONS_ENABLED:false}
      dry-run: ${MONGODB_MIGRATIONS_DRY_RUN:true}
      lock-duration: ${MONGODB_MIGRATIONS_LOCK_DURATION:15m}

logging:
  level:
    root: ${LOG_LEVEL:INFO}
  structured:
    format:
      console: ${LOG_FORMAT:ecs}
    ecs:
      service:
        environment: ${APP_ENV:local}
        version: ${APP_VERSION:dev}
    json:
      stacktrace:
        max-length: 2048
        max-throwable-depth: 12
  include-application-name: false
  pattern:
    correlation: "[${spring.application.name:},%X{traceId:-},%X{spanId:-},%X{correlationId:-}] "
