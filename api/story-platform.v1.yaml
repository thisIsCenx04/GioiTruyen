openapi: 3.1.0
info:
  title: GioiTruyen Story Platform API
  version: 1.0.0
  description: |
    Public HTTP contract for the GioiTruyen platform. This contract grows
    incrementally with each implemented vertical slice.
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
servers:
  - url: /api/v1
    description: Application context path
tags:
  - name: Operations
    description: Safe operational probes exposed to load balancers and orchestrators.
  - name: Identity
    description: Public account registration and identity lifecycle operations.
  - name: Profiles
    description: Private account details and allowlisted public profile fields.
  - name: Teams
    description: Public team profiles and owner-managed settings.
security:
  - bearerAuth: []
paths:
  /actuator/health:
    get:
      operationId: getAggregateHealth
      summary: Get aggregate application health
      description: Returns only the aggregate status and never dependency details.
      tags:
        - Operations
      security: []
      responses:
        "200":
          $ref: "#/components/responses/HealthUp"
        "503":
          $ref: "#/components/responses/HealthUnavailable"
        "404":
          $ref: "#/components/responses/NotFound"
  /actuator/health/liveness:
    get:
      operationId: getLiveness
      summary: Get application liveness
      description: Reports whether the process is internally able to continue running.
      tags:
        - Operations
      security: []
      responses:
        "200":
          $ref: "#/components/responses/HealthUp"
        "503":
          $ref: "#/components/responses/HealthUnavailable"
        "404":
          $ref: "#/components/responses/NotFound"
  /actuator/health/readiness:
    get:
      operationId: getReadiness
      summary: Get application readiness
      description: Reports whether the application and required data stores can serve traffic.
      tags:
        - Operations
      security: []
      responses:
        "200":
          $ref: "#/components/responses/HealthUp"
        "503":
          $ref: "#/components/responses/HealthUnavailable"
        "404":
          $ref: "#/components/responses/NotFound"
  /actuator/info:
    get:
      operationId: getApplicationInfo
      summary: Get safe application information
      description: Returns explicitly configured non-sensitive application metadata.
      tags:
        - Operations
      security: []
      responses:
        "200":
          description: Safe application information.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApplicationInfo"
        "404":
          $ref: "#/components/responses/NotFound"
  /livez:
    get:
      operationId: getAdditionalLiveness
      summary: Get short-form application liveness
      description: Alias used by infrastructure that expects a conventional liveness path.
      tags:
        - Operations
      security: []
      responses:
        "200":
          $ref: "#/components/responses/HealthUp"
        "503":
          $ref: "#/components/responses/HealthUnavailable"
        "404":
          $ref: "#/components/responses/NotFound"
  /readyz:
    get:
      operationId: getAdditionalReadiness
      summary: Get short-form application readiness
      description: Alias used by infrastructure that expects a conventional readiness path.
      tags:
        - Operations
      security: []
      responses:
        "200":
          $ref: "#/components/responses/HealthUp"
        "503":
          $ref: "#/components/responses/HealthUnavailable"
        "404":
          $ref: "#/components/responses/NotFound"
  /auth/register:
    post:
      operationId: registerUser
      summary: Register a pending user account
      description: |
        Accepts the current terms and creates a pending account when the
        normalized email is available. Eligible and duplicate addresses
        receive the same response to prevent account enumeration.
      tags:
        - Identity
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegistrationRequest"
      responses:
        "202":
          description: |
            The request was accepted without disclosing whether the email
            already exists.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RegistrationResponse"
        "400":
          description: The request or active consent version is invalid.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "413":
          description: The request exceeds the configured body limit.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /auth/email/verify:
    post:
      operationId: verifyEmail
      summary: Verify an email address with a single-use token
      description: |
        Consumes a valid, unexpired verification token and activates the
        pending account. Invalid, expired, and replayed tokens receive the
        same response.
      tags:
        - Identity
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmailVerificationRequest"
      responses:
        "204":
          description: The email address was verified.
        "400":
          description: The token is malformed, invalid, expired, or consumed.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "413":
          description: The request exceeds the configured body limit.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /auth/login:
    post:
      operationId: login
      summary: Authenticate an active account
      description: |
        Verifies the password with Argon2id and applies email and network
        risk limits. Unknown accounts, invalid passwords, and inactive
        accounts use the same generic authentication failure.
      tags:
        - Identity
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Authentication succeeded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "400":
          description: The request is malformed.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "401":
          description: Credentials, MFA code, or account state are invalid.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "403":
          description: A privileged account must enroll MFA before login.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "429":
          description: Login risk limits were exceeded.
          headers:
            Retry-After:
              description: Seconds before the client should retry.
              schema:
                type: integer
                minimum: 1
                maximum: 86400
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "503":
          description: Risk controls are temporarily unavailable.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /auth/refresh:
    post:
      operationId: refreshSession
      summary: Rotate a refresh token family
      description: |
        Consumes the current refresh token and returns a new access and
        refresh token pair. Replaying a previously consumed token revokes
        the entire token family.
      tags:
        - Identity
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshSessionRequest"
      responses:
        "200":
          description: The refresh token was rotated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "400":
          description: The request is malformed.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "401":
          description: The token is invalid, expired, revoked, or replayed.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /auth/mfa/challenge:
    post:
      operationId: beginMfaEnrollment
      summary: Start encrypted TOTP enrollment
      description: |
        Replaces any unverified enrollment and returns a provisioning secret
        once. The server stores only an AES-GCM protected form.
      tags:
        - Identity
      responses:
        "200":
          description: TOTP enrollment challenge created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MfaChallengeResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          description: MFA is already enabled and cannot be replaced here.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /auth/mfa/verify:
    post:
      operationId: verifyMfaEnrollment
      summary: Activate TOTP and issue one-time recovery codes
      description: |
        Activates the pending factor, increments the account security version,
        and revokes all existing sessions. Recovery codes are returned once.
      tags:
        - Identity
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MfaVerificationRequest"
      responses:
        "200":
          description: MFA activated; recovery codes must be stored securely.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MfaActivationResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          description: MFA verification attempts exceeded the risk limit.
          headers:
            Retry-After:
              schema:
                type: integer
                minimum: 1
                maximum: 86400
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "503":
          description: MFA risk controls are temporarily unavailable.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /auth/password/forgot:
    post:
      operationId: requestPasswordReset
      summary: Request a password reset without account disclosure
      description: |
        Always returns the same accepted response. When an active account
        exists, a hashed, expiring, single-use token is queued for delivery.
      tags:
        - Identity
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ForgotPasswordRequest"
      responses:
        "202":
          description: The request was accepted without disclosing account state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PasswordResetAccepted"
        "400":
          $ref: "#/components/responses/BadRequest"
  /auth/password/reset:
    post:
      operationId: resetPassword
      summary: Consume a single-use password reset token
      description: |
        Replaces the Argon2id password, increments the security version, and
        revokes every existing session atomically.
      tags:
        - Identity
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResetPasswordRequest"
      responses:
        "204":
          description: Password reset and session revocation completed.
        "400":
          $ref: "#/components/responses/BadRequest"
  /auth/reauth/grants:
    post:
      operationId: issueReauthenticationGrant
      summary: Issue a single-use scoped reauthentication grant
      description: |
        Verifies the current password and applicable MFA proof, then issues an
        opaque short-lived grant bound to actor, scope, target type, and target
        ID. Downstream sensitive actions must consume it atomically.
      tags:
        - Identity
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReauthenticationGrantRequest"
      responses:
        "200":
          description: Scoped reauthentication grant issued.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReauthenticationGrantResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          description: Reauthentication attempts exceeded the risk limit.
          headers:
            Retry-After:
              schema:
                type: integer
                minimum: 1
                maximum: 86400
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "503":
          description: Reauthentication risk controls are unavailable.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /auth/logout:
    post:
      operationId: logout
      summary: Revoke the current session
      tags:
        - Identity
      responses:
        "204":
          description: The current session is revoked or already inactive.
        "401":
          description: The access token or session is invalid.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /auth/sessions:
    get:
      operationId: listSessions
      summary: List active sessions with minimal masked metadata
      tags:
        - Identity
      responses:
        "200":
          description: Active sessions ordered by recent activity.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionListResponse"
        "401":
          description: The access token or session is invalid.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
    delete:
      operationId: revokeAllSessions
      summary: Revoke all active sessions
      tags:
        - Identity
      responses:
        "204":
          description: All owned sessions are revoked.
        "401":
          description: The access token or session is invalid.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /auth/sessions/{sessionId}:
    delete:
      operationId: revokeSession
      summary: Revoke one owned session
      tags:
        - Identity
      parameters:
        - name: sessionId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: The owned session is revoked or already inactive.
        "400":
          description: The session identifier is malformed.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "401":
          description: The access token or session is invalid.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /me:
    get:
      operationId: getPrivateProfile
      summary: Get the authenticated user's private profile
      tags: [Profiles]
      responses:
        "200":
          description: Private owner-only profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PrivateProfile"
        "401":
          $ref: "#/components/responses/Unauthorized"
    patch:
      operationId: updatePrivateProfile
      summary: Update profile fields with optimistic concurrency
      tags: [Profiles]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateProfileRequest"
      responses:
        "200":
          description: Updated private profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PrivateProfile"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          description: The supplied profile version is stale
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /users/{userId}:
    get:
      operationId: getPublicProfile
      summary: Get an allowlisted public profile
      security: []
      tags: [Profiles]
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Public profile without identity or security fields
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicProfile"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
  /teams:
    get:
      operationId: listTeams
      summary: List active public teams
      security: []
      tags: [Teams]
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 20
      responses:
        "200":
          description: Active teams ordered by latest update
          content:
            application/json:
              schema:
                type: array
                maxItems: 50
                items:
                  $ref: "#/components/schemas/Team"
        "400":
          $ref: "#/components/responses/BadRequest"
    post:
      operationId: createTeam
      summary: Create a team and atomically make the creator its owner
      tags: [Teams]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTeamRequest"
      responses:
        "201":
          description: Team and owner membership created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Team"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          description: Team slug is already used
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /teams/{teamId}:
    get:
      operationId: getTeam
      summary: Get an active public team
      security: []
      tags: [Teams]
      parameters:
        - $ref: "#/components/parameters/TeamId"
      responses:
        "200":
          description: Public team
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Team"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      operationId: updateTeam
      summary: Update a team as its owner with optimistic concurrency
      tags: [Teams]
      parameters:
        - $ref: "#/components/parameters/TeamId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateTeamRequest"
      responses:
        "200":
          description: Updated team
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Team"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Team version is stale
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /teams/{teamId}/members:
    get:
      operationId: listTeamMembers
      summary: List memberships as an active Team owner
      tags: [Teams]
      parameters:
        - $ref: "#/components/parameters/TeamId"
      responses:
        "200":
          description: Team memberships
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TeamMembership"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      operationId: inviteTeamMember
      summary: Idempotently invite an active user as a Team member
      tags: [Teams]
      parameters:
        - $ref: "#/components/parameters/TeamId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddTeamMemberRequest"
      responses:
        "201":
          description: Invited membership created or replayed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TeamMembership"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Duplicate membership or invalid request replay
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /teams/{teamId}/members/{userId}:
    delete:
      operationId: removeTeamMember
      summary: Revoke a member while preserving the final owner
      tags: [Teams]
      parameters:
        - $ref: "#/components/parameters/TeamId"
        - name: userId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: version
          in: query
          required: true
          schema:
            type: integer
            format: int64
            minimum: 0
      responses:
        "204":
          description: Membership revoked
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: The final owner cannot be removed
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /teams/{teamId}/members/{userId}/permissions:
    patch:
      operationId: updateTeamMemberPermissions
      summary: Replace a member permission set using optimistic concurrency
      tags: [Teams]
      parameters:
        - $ref: "#/components/parameters/TeamId"
        - name: userId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateTeamPermissionsRequest"
      responses:
        "200":
          description: Versioned membership permissions updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TeamMembership"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Membership version is stale
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /team-invitations/{token}/accept:
    post:
      operationId: acceptTeamInvitation
      summary: Idempotently activate an invitation for its target user
      tags: [Teams]
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
            minLength: 43
            maxLength: 128
            pattern: "^[A-Za-z0-9._-]+$"
      responses:
        "200":
          description: Active membership
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TeamMembership"
        "404":
          $ref: "#/components/responses/NotFound"
  /teams/{teamId}/follow:
    get:
      operationId: getTeamFollowStatus
      summary: Get the current user's follow state and authoritative count
      tags: [Teams]
      parameters:
        - $ref: "#/components/parameters/TeamId"
      responses:
        "200":
          description: Current follow state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TeamFollow"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      operationId: followTeam
      summary: Idempotently follow an active Team
      tags: [Teams]
      parameters:
        - $ref: "#/components/parameters/TeamId"
      responses:
        "200":
          description: Following; repeated calls produce no duplicate relation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TeamFollow"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      operationId: unfollowTeam
      summary: Idempotently stop following an active Team
      tags: [Teams]
      parameters:
        - $ref: "#/components/parameters/TeamId"
      responses:
        "200":
          description: Not following; repeated calls produce no counter delta
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TeamFollow"
        "404":
          $ref: "#/components/responses/NotFound"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Access token issued by the GioiTruyen identity service.
  parameters:
    TeamId:
      name: teamId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 8
        maxLength: 128
        pattern: "^[A-Za-z0-9][A-Za-z0-9._:-]+$"
  schemas:
    RegistrationRequest:
      type: object
      additionalProperties: false
      required:
        - email
        - password
        - acceptedTerms
        - consentVersion
      properties:
        email:
          type: string
          format: email
          maxLength: 254
        password:
          type: string
          format: password
          writeOnly: true
          minLength: 12
          maxLength: 128
        acceptedTerms:
          type: boolean
          const: true
        consentVersion:
          type: string
          pattern: '^[0-9]{4}-[0-9]{2}-[0-9]{2}$'
          example: "2026-07-24"
    RegistrationResponse:
      type: object
      additionalProperties: false
      required:
        - status
        - message
      properties:
        status:
          type: string
          const: PENDING_VERIFICATION
        message:
          type: string
          description: Generic response that does not reveal account existence.
    EmailVerificationRequest:
      type: object
      additionalProperties: false
      required:
        - token
      properties:
        token:
          type: string
          minLength: 1
          maxLength: 128
          pattern: '^[A-Za-z0-9._-]+$'
          writeOnly: true
    LoginRequest:
      type: object
      additionalProperties: false
      required:
        - email
        - password
      properties:
        email:
          type: string
          maxLength: 254
        password:
          type: string
          format: password
          writeOnly: true
          minLength: 1
          maxLength: 128
        mfaCode:
          type: string
          minLength: 6
          maxLength: 32
          description: Six-digit TOTP or a single-use recovery code.
          writeOnly: true
    LoginResponse:
      type: object
      additionalProperties: false
      required:
        - accessToken
        - tokenType
        - expiresIn
        - refreshToken
      properties:
        accessToken:
          type: string
          format: jwt
          minLength: 32
        tokenType:
          type: string
          const: Bearer
        expiresIn:
          type: integer
          minimum: 60
          maximum: 1800
        refreshToken:
          type: string
          minLength: 43
          maxLength: 128
    RefreshSessionRequest:
      type: object
      additionalProperties: false
      required:
        - refreshToken
      properties:
        refreshToken:
          type: string
          writeOnly: true
          minLength: 43
          maxLength: 128
          pattern: '^[A-Za-z0-9_-]+$'
    MfaVerificationRequest:
      type: object
      additionalProperties: false
      required:
        - code
      properties:
        code:
          type: string
          pattern: '^[0-9]{6}$'
          writeOnly: true
    MfaChallengeResponse:
      type: object
      additionalProperties: false
      required:
        - provisioningSecret
        - algorithm
        - digits
        - periodSeconds
      properties:
        provisioningSecret:
          type: string
          pattern: '^[A-Z2-7]{32}$'
          writeOnly: true
        algorithm:
          type: string
          const: SHA1
        digits:
          type: integer
          const: 6
        periodSeconds:
          type: integer
          const: 30
    MfaActivationResponse:
      type: object
      additionalProperties: false
      required:
        - recoveryCodes
      properties:
        recoveryCodes:
          type: array
          minItems: 8
          maxItems: 8
          items:
            type: string
            minLength: 16
            maxLength: 16
            writeOnly: true
    ForgotPasswordRequest:
      type: object
      additionalProperties: false
      required:
        - email
      properties:
        email:
          type: string
          format: email
          maxLength: 320
    ResetPasswordRequest:
      type: object
      additionalProperties: false
      required:
        - token
        - newPassword
      properties:
        token:
          type: string
          minLength: 1
          maxLength: 128
        newPassword:
          type: string
          minLength: 12
          maxLength: 128
          format: password
    PasswordResetAccepted:
      type: object
      additionalProperties: false
      required:
        - status
      properties:
        status:
          type: string
          enum:
            - ACCEPTED
    ReauthenticationGrantRequest:
      type: object
      additionalProperties: false
      required:
        - password
        - scope
        - targetType
        - targetId
      properties:
        password:
          type: string
          format: password
          minLength: 1
          maxLength: 128
          writeOnly: true
        mfaCode:
          type: string
          minLength: 6
          maxLength: 32
          writeOnly: true
        scope:
          type: string
          enum:
            - EMAIL_CHANGE
            - MFA_FACTOR_CHANGE
            - TEAM_OWNER_CHANGE
            - TEAM_DESTINATION_CHANGE
            - MODERATION_EMERGENCY_TAKEDOWN
            - TOPUP_MANUAL_APPROVAL
            - WITHDRAWAL_APPROVAL
            - SYSTEM_CONFIG_CHANGE
        targetType:
          type: string
          pattern: '^[a-z][a-z0-9_-]{0,63}$'
        targetId:
          type: string
          pattern: '^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$'
    ReauthenticationGrantResponse:
      type: object
      additionalProperties: false
      required:
        - grantToken
        - grantType
        - expiresIn
        - expiresAt
      properties:
        grantToken:
          type: string
          pattern: '^[A-Za-z0-9_-]{43}$'
          writeOnly: true
        grantType:
          type: string
          const: Scoped-Reauthentication
        expiresIn:
          type: integer
          minimum: 60
          maximum: 900
        expiresAt:
          type: string
          format: date-time
    SessionListResponse:
      type: object
      additionalProperties: false
      required:
        - sessions
      properties:
        sessions:
          type: array
          maxItems: 500
          items:
            $ref: "#/components/schemas/Session"
    Session:
      type: object
      additionalProperties: false
      required:
        - sessionId
        - createdAt
        - lastUsedAt
        - expiresAt
        - current
      properties:
        sessionId:
          type: string
          format: uuid
        createdAt:
          type: string
          format: date-time
        lastUsedAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
        current:
          type: boolean
    UpdateProfileRequest:
      type: object
      additionalProperties: false
      required: [displayName, version]
      properties:
        displayName:
          type: string
          minLength: 2
          maxLength: 80
        bio:
          type: string
          maxLength: 500
        avatarMediaId:
          type: [string, "null"]
          format: uuid
        version:
          type: integer
          format: int64
          minimum: 0
    PublicProfile:
      type: object
      additionalProperties: false
      required: [id, displayName, bio, version]
      properties:
        id:
          type: string
          format: uuid
        displayName:
          type: string
        bio:
          type: string
        avatarMediaId:
          type: [string, "null"]
          format: uuid
        version:
          type: integer
          format: int64
    PrivateProfile:
      type: object
      additionalProperties: false
      required:
        - id
        - email
        - roles
        - state
        - displayName
        - bio
        - version
        - createdAt
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        roles:
          type: array
          uniqueItems: true
          items:
            type: string
        state:
          type: string
        displayName:
          type: string
        bio:
          type: string
        avatarMediaId:
          type: [string, "null"]
          format: uuid
        version:
          type: integer
          format: int64
        createdAt:
          type: string
          format: date-time
    CreateTeamRequest:
      type: object
      additionalProperties: false
      required: [slug, name]
      properties:
        slug:
          type: string
          pattern: "^[a-z0-9]+(?:-[a-z0-9]+)*$"
          minLength: 3
          maxLength: 50
        name:
          type: string
          minLength: 2
          maxLength: 100
        description:
          type: string
          maxLength: 1000
    UpdateTeamRequest:
      type: object
      additionalProperties: false
      required: [name, version]
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 100
        description:
          type: string
          maxLength: 1000
        version:
          type: integer
          format: int64
          minimum: 0
    Team:
      type: object
      additionalProperties: false
      required: [id, slug, name, description, state, version]
      properties:
        id:
          type: string
          format: uuid
        slug:
          type: string
        name:
          type: string
        description:
          type: string
        state:
          type: string
          enum: [ACTIVE, SUSPENDED, ARCHIVED]
        version:
          type: integer
          format: int64
    AddTeamMemberRequest:
      type: object
      additionalProperties: false
      required: [userId, permissions]
      properties:
        userId:
          type: string
          format: uuid
        permissions:
          type: array
          minItems: 1
          maxItems: 6
          uniqueItems: true
          items:
            type: string
            enum:
              - story:create
              - story:edit
              - story:submit
              - story:publish
              - analytics:read
              - finance:request
    TeamMembership:
      type: object
      additionalProperties: false
      required:
        - teamId
        - userId
        - role
        - permissions
        - state
        - joinedAt
        - version
      properties:
        teamId:
          type: string
          format: uuid
        userId:
          type: string
          format: uuid
        role:
          type: string
          enum: [OWNER, MEMBER]
        permissions:
          type: array
          uniqueItems: true
          items:
            type: string
        state:
          type: string
          enum: [INVITED, ACTIVE, REVOKED]
        joinedAt:
          type: string
          format: date-time
        version:
          type: integer
          format: int64
    UpdateTeamPermissionsRequest:
      type: object
      additionalProperties: false
      required: [permissions, version]
      properties:
        permissions:
          type: array
          minItems: 1
          maxItems: 6
          uniqueItems: true
          items:
            type: string
            enum:
              - story:create
              - story:edit
              - story:submit
              - story:publish
              - analytics:read
              - finance:request
        version:
          type: integer
          format: int64
          minimum: 0
    TeamFollow:
      type: object
      additionalProperties: false
      required: [teamId, following, followerCount]
      properties:
        teamId:
          type: string
          format: uuid
        following:
          type: boolean
        followerCount:
          type: integer
          format: int64
          minimum: 0
    ApplicationInfo:
      type: object
      description: Allowlisted non-sensitive build and application metadata.
      additionalProperties: true
    Health:
      type: object
      description: Aggregate health response without component or topology details.
      additionalProperties: false
      required:
        - status
      properties:
        status:
          type: string
          description: Aggregate application status.
          enum:
            - UP
            - DOWN
            - OUT_OF_SERVICE
            - UNKNOWN
    Problem:
      type: object
      description: RFC 9457 problem detail response.
      additionalProperties: true
      required:
        - type
        - title
        - status
      properties:
        type:
          type: string
          format: uri-reference
        title:
          type: string
        status:
          type: integer
          minimum: 400
          maximum: 599
        detail:
          type: string
        instance:
          type: string
          format: uri-reference
  responses:
    BadRequest:
      description: The request, token, or proposed password is invalid.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Unauthorized:
      description: The access token, session, or MFA proof is invalid.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Forbidden:
      description: The authenticated actor lacks the required Team ownership.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    HealthUp:
      description: The requested health group is available.
      content:
        application/vnd.spring-boot.actuator.v3+json:
          schema:
            $ref: "#/components/schemas/Health"
        application/json:
          schema:
            $ref: "#/components/schemas/Health"
    HealthUnavailable:
      description: The requested health group is unavailable.
      content:
        application/vnd.spring-boot.actuator.v3+json:
          schema:
            $ref: "#/components/schemas/Health"
        application/json:
          schema:
            $ref: "#/components/schemas/Health"
    NotFound:
      description: The requested endpoint is not exposed by this deployment.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
