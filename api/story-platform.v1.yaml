        score:
          type: number
          format: double
          minimum: 0
        highlights:
          type: array
          maxItems: 5
          items:
            type: string
            maxLength: 200
    SuggestionResponse:
      type: object
      additionalProperties: false
      required: [items, nextCursor, hasMore]
      properties:
        items:
          type: array
          maxItems: 10
          items:
            $ref: "#/components/schemas/Suggestion"
        nextCursor:
          type: [string, "null"]
          maxLength: 2048
        hasMore:
          type: boolean
    Suggestion:
      type: object
      additionalProperties: false
      required: [id, slug, title]
      properties:
        id:
          type: string
          format: uuid
        slug:
          type: string
          maxLength: 100
        title:
          type: string
          maxLength: 200
        coverAssetId:
          type: [string, "null"]
          format: uuid
    PublicStory:
      type: object
      additionalProperties: false
      required:
        - id
        - teamId
        - slug
        - title
        - synopsis
        - categoryIds
        - origin
        - language
        - completionStatus
        - publishedAt
        - updatedAt
        - version
      properties:
        id:
          type: string
          format: uuid
        teamId:
          type: string
          format: uuid
        slug:
          type: string
        title:
          type: string
        synopsis:
          type: string
        categoryIds:
          type: array
          maxItems: 30
          uniqueItems: true
          items:
            type: string
            format: uuid
        origin:
          type: string
          enum: [ORIGINAL, TRANSLATED]
        language:
          type: string
        completionStatus:
          type: string
          enum: [ONGOING, COMPLETED, HIATUS]
        publishedAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        version:
          type: integer
          format: int64
          minimum: 1
    PublicChapterPage:
      type: object
      additionalProperties: false
      required: [items, nextCursor, hasMore]
      properties:
        items:
          type: array
          maxItems: 100
          items:
            $ref: "#/components/schemas/PublicChapter"
        nextCursor:
          type: [string, "null"]
          maxLength: 512
        hasMore:
          type: boolean
    PublicChapter:
      type: object
      additionalProperties: false
      required:
        - id
        - storyId
        - number
        - slug
        - title
        - publishedAt
        - version
      properties:
        id:
          type: string
          format: uuid
        storyId:
          type: string
          format: uuid
        number:
          type: integer
          minimum: 1
        slug:
          type: string
          pattern: "^[a-z0-9]+(?:-[a-z0-9]+)*$"
          maxLength: 100
        title:
          type: string
          minLength: 1
          maxLength: 200
        publishedAt:
          type: string
          format: date-time
        version:
          type: integer
          format: int64
          minimum: 1
    PublishedChapterDetail:
      type: object
      additionalProperties: false
      required:
        - id
        - storyId
        - number
        - slug
        - title
        - revisionId
        - revisionNo
        - contentHtml
        - wordCount
        - publishedAt
        - version
        - etag
        - previous
        - next
      properties:
        id:
          type: string
          format: uuid
        storyId:
          type: string
          format: uuid
        number:
          type: integer
          minimum: 1
        slug:
          type: string
          pattern: "^[a-z0-9]+(?:-[a-z0-9]+)*$"
        title:
          type: string
          maxLength: 200
        revisionId:
          type: string
          format: uuid
        revisionNo:
          type: integer
          format: int64
          minimum: 1
        contentHtml:
          type: string
          maxLength: 1000000
          description: Server-sanitized immutable HTML.
        wordCount:
          type: integer
          minimum: 0
        publishedAt:
          type: string
          format: date-time
        version:
          type: integer
          format: int64
          minimum: 1
        etag:
          type: string
          pattern: "^[0-9a-f]{64}$"
        previous:
          oneOf:
            - $ref: "#/components/schemas/ChapterLink"
            - type: "null"
        next:
          oneOf:
            - $ref: "#/components/schemas/ChapterLink"
            - type: "null"
    ChapterLink:
      type: object
      additionalProperties: false
      required: [id, number, slug, title]
      properties:
        id:
          type: string
          format: uuid
        number:
          type: integer
          minimum: 1
        slug:
          type: string
          pattern: "^[a-z0-9]+(?:-[a-z0-9]+)*$"
        title:
          type: string
          maxLength: 200
    SynchronizeReadingProgressRequest:
      type: object
      additionalProperties: false
      required: [chapterId, position, deviceUpdatedAt]
      properties:
        chapterId:
          type: string
          format: uuid
        position:
          type: number
          minimum: 0
          maximum: 100
        deviceUpdatedAt:
          type: string
          format: date-time
    StartReadingSessionRequest:
      type: object
      additionalProperties: false
      required: [storyId, chapterId]
      properties:
        storyId:
          type: string
          format: uuid
        chapterId:
          type: string
          format: uuid
        anonymousId:
          type: string
          format: uuid
          description: Required only when no bearer identity is present.
    ReadingSessionGrant:
      type: object
      additionalProperties: false
      required:
        - sessionId
        - sessionToken
        - expiresAt
        - heartbeatIntervalSeconds
      properties:
        sessionId:
          type: string
          format: uuid
        sessionToken:
          type: string
          minLength: 80
          maxLength: 1024
        expiresAt:
          type: string
          format: date-time
        heartbeatIntervalSeconds:
          type: integer
          minimum: 5
          maximum: 60
    ReadingHeartbeatBatch:
      type: object
      additionalProperties: false
      required: [batchId, heartbeats]
      properties:
        batchId:
          type: string
          format: uuid
        heartbeats:
          type: array
          minItems: 1
          maxItems: 20
          items:
            $ref: "#/components/schemas/ReadingHeartbeat"
    ReadingHeartbeat:
      type: object
      additionalProperties: false
      required: [sequence, occurredAt, position, activeSeconds]
      properties:
        sequence:
          type: integer
          format: int64
          minimum: 1
        occurredAt:
          type: string
          format: date-time
        position:
          type: number
          minimum: 0
          maximum: 100
        activeSeconds:
          type: integer
          minimum: 0
          maximum: 60
    ReadingHeartbeatReceipt:
      type: object
      additionalProperties: false
      required: [batchId, nextSequence, duplicate]
      properties:
        batchId:
          type: string
          format: uuid
        nextSequence:
          type: integer
          format: int64
          minimum: 2
        duplicate:
          type: boolean
    ReadingCompletionRequest:
      type: object
      additionalProperties: false
      required: [completionId, finalSequence, occurredAt, position]
      properties:
        completionId:
          type: string
          format: uuid
        finalSequence:
          type: integer
          format: int64
          minimum: 0
        occurredAt:
          type: string
          format: date-time
        position:
          type: number
          minimum: 0
          maximum: 100
    ReadingCompletionReceipt:
      type: object
      additionalProperties: false
      required: [completionId, status, duplicate]
      properties:
        completionId:
          type: string
          format: uuid
        status:
          type: string
          const: COMPLETION_PENDING
        duplicate:
          type: boolean
    ReadingProgress:
      type: object
      additionalProperties: false
      required:
        - storyId
        - chapterId
        - position
        - deviceUpdatedAt
        - updatedAt
        - version
      properties:
        storyId:
          type: string
          format: uuid
        chapterId:
          type: string
          format: uuid
        position:
          type: number
          minimum: 0
          maximum: 100
        deviceUpdatedAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        version:
          type: integer
          format: int64
          minimum: 1
    ReadingHistoryPage:
      type: object
      additionalProperties: false
      required: [items, nextCursor, hasMore]
      properties:
        items:
          type: array
          maxItems: 100
          items:
            $ref: "#/components/schemas/ReadingProgress"
        nextCursor:
          type:
            - string
            - "null"
          maxLength: 512
        hasMore:
          type: boolean
    StoryRelation:
      type: object
      additionalProperties: false
      required: [storyId, type, active, count]
      properties:
        storyId:
          type: string
          format: uuid
        type:
          type: string
          enum: [FAVORITE, FOLLOW]
        active:
          type: boolean
        count:
          type: integer
          format: int64
          minimum: 0
    CreateCommentRequest:
      type: object
      additionalProperties: false
      required: [targetType, targetId, body]
      properties:
        targetType:
          type: string
          enum: [story, chapter]
        targetId:
          type: string
          format: uuid
        parentId:
          type: string
          format: uuid
        body:
          type: string
          minLength: 1
          maxLength: 5000
    UpdateCommentRequest:
      type: object
      additionalProperties: false
      required: [body]
      properties:
        body:
          type: string
          minLength: 1
          maxLength: 5000
    Comment:
      type: object
      additionalProperties: false
      required:
        - id
        - targetType
        - targetId
        - rootId
        - depth
        - author
        - body
        - status
        - version
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          format: uuid
        targetType:
          type: string
          enum: [STORY, CHAPTER]
        targetId:
          type: string
          format: uuid
        parentId:
          type: [string, "null"]
          format: uuid
        rootId:
          type: string
          format: uuid
        depth:
          type: integer
          minimum: 0
          maximum: 2
        author:
          $ref: "#/components/schemas/CommentAuthor"
        body:
          type: string
        status:
          type: string
          enum: [VISIBLE, HIDDEN, DELETED]
        version:
          type: integer
          format: int64
          minimum: 1
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    CommentAuthor:
      type: object
      additionalProperties: false
      required: [id, displayName]
      properties:
        id:
          type: string
          format: uuid
        displayName:
          type: string
        avatarMediaId:
          type: [string, "null"]
          format: uuid
    CommentPage:
      type: object
      additionalProperties: false
      required: [items, nextCursor, hasMore]
      properties:
        items:
          type: array
          maxItems: 100
          items:
            $ref: "#/components/schemas/Comment"
        nextCursor:
          type: [string, "null"]
          maxLength: 512
        hasMore:
          type: boolean
    Reaction:
      type: object
      additionalProperties: false
      required: [targetType, targetId, active, count]
      properties:
        targetType:
          type: string
          enum: [STORY, CHAPTER, COMMENT]
        targetId:
          type: string
          format: uuid
        active:
          type: boolean
        count:
          type: integer
          format: int64
          minimum: 0
    Team:
      type: object
      additionalProperties: false
      required: [id, slug, name, description, state, version]
      properties:
        id:
          type: string
          format: uuid
        slug:
          type: string
        name:
          type: string
        description:
          type: string
        state:
          type: string
          enum: [ACTIVE, SUSPENDED, ARCHIVED]
        version:
          type: integer
          format: int64
    AddTeamMemberRequest:
      type: object
      additionalProperties: false
      required: [userId, permissions]
      properties:
        userId:
          type: string
          format: uuid
        permissions:
          type: array
          minItems: 1
          maxItems: 6
          uniqueItems: true
          items:
            type: string
            enum:
              - story:create
              - story:edit
              - story:submit
              - story:publish
              - analytics:read
              - finance:request
    TeamMembership:
      type: object
      additionalProperties: false
      required:
        - teamId
        - userId
        - role
        - permissions
        - state
        - joinedAt
        - version
      properties:
        teamId:
          type: string
          format: uuid
        userId:
          type: string
          format: uuid
        role:
          type: string
          enum: [OWNER, MEMBER]
        permissions:
          type: array
          uniqueItems: true
          items:
            type: string
        state:
          type: string
          enum: [INVITED, ACTIVE, REVOKED]
        joinedAt:
          type: string
          format: date-time
        version:
          type: integer
          format: int64
    UpdateTeamPermissionsRequest:
      type: object
      additionalProperties: false
      required: [permissions, version]
      properties:
        permissions:
          type: array
          minItems: 1
          maxItems: 6
          uniqueItems: true
          items:
            type: string
            enum:
              - story:create
              - story:edit
              - story:submit
              - story:publish
              - analytics:read
              - finance:request
        version:
          type: integer
          format: int64
          minimum: 0
    TeamFollow:
      type: object
      additionalProperties: false
      required: [teamId, following, followerCount]
      properties:
        teamId:
          type: string
          format: uuid
        following:
          type: boolean
        followerCount:
          type: integer
          format: int64
          minimum: 0
    ApplicationInfo:
      type: object
      description: Allowlisted non-sensitive build and application metadata.
      additionalProperties: true
    Health:
      type: object
      description: Aggregate health response without component or topology details.
      additionalProperties: false
      required:
        - status
      properties:
        status:
          type: string
          description: Aggregate application status.
          enum:
            - UP
            - DOWN
            - OUT_OF_SERVICE
            - UNKNOWN
    Problem:
      type: object
      description: RFC 9457 problem detail response.
      additionalProperties: true
      required:
        - type
        - title
        - status
      properties:
        type:
          type: string
          format: uri-reference
        title:
          type: string
        status:
          type: integer
          minimum: 400
          maximum: 599
        detail:
          type: string
        instance:
          type: string
          format: uri-reference
  responses:
    Reaction:
      description: Caller reaction state and authoritative target count
      headers:
        Cache-Control:
          schema:
            type: string
            const: no-store
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Reaction"
    StoryRelation:
      description: Caller relation state and source-of-truth count
      headers:
        Cache-Control:
          schema:
            type: string
            const: no-store
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/StoryRelation"
    BadRequest:
      description: The request, token, or proposed password is invalid.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Unauthorized:
      description: The access token, session, or MFA proof is invalid.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Forbidden:
      description: The authenticated actor lacks the required Team ownership.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Conflict:
      description: The resource version or business uniqueness rule conflicts.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    RateLimited:
      description: The caller exceeded a safety-bounded request quota.
      headers:
        Retry-After:
          schema:
            type: integer
            minimum: 1
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    ServiceUnavailable:
      description: A required fail-closed dependency is unavailable.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    HealthUp:
      description: The requested health group is available.
      content:
        application/vnd.spring-boot.actuator.v3+json:
          schema:
            $ref: "#/components/schemas/Health"
        application/json:
          schema:
            $ref: "#/components/schemas/Health"
    HealthUnavailable:
      description: The requested health group is unavailable.
      content:
        application/vnd.spring-boot.actuator.v3+json:
          schema:
            $ref: "#/components/schemas/Health"
        application/json:
          schema:
            $ref: "#/components/schemas/Health"
    NotFound:
      description: The requested endpoint is not exposed by this deployment.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
