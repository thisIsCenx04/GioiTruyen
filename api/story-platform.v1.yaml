openapi: 3.1.0
info:
  title: GioiTruyen Story Platform API
  version: 1.0.0
  description: |
    Public HTTP contract for the GioiTruyen platform. This contract grows
    incrementally with each implemented vertical slice.
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
servers:
  - url: /api/v1
    description: Application context path
tags:
  - name: Operations
    description: Safe operational probes exposed to load balancers and orchestrators.
  - name: Identity
    description: Public account registration and identity lifecycle operations.
security:
  - bearerAuth: []
paths:
  /actuator/health:
    get:
      operationId: getAggregateHealth
      summary: Get aggregate application health
      description: Returns only the aggregate status and never dependency details.
      tags:
        - Operations
      security: []
      responses:
        "200":
          $ref: "#/components/responses/HealthUp"
        "503":
          $ref: "#/components/responses/HealthUnavailable"
        "404":
          $ref: "#/components/responses/NotFound"
  /actuator/health/liveness:
    get:
      operationId: getLiveness
      summary: Get application liveness
      description: Reports whether the process is internally able to continue running.
      tags:
        - Operations
      security: []
      responses:
        "200":
          $ref: "#/components/responses/HealthUp"
        "503":
          $ref: "#/components/responses/HealthUnavailable"
        "404":
          $ref: "#/components/responses/NotFound"
  /actuator/health/readiness:
    get:
      operationId: getReadiness
      summary: Get application readiness
      description: Reports whether the application and required data stores can serve traffic.
      tags:
        - Operations
      security: []
      responses:
        "200":
          $ref: "#/components/responses/HealthUp"
        "503":
          $ref: "#/components/responses/HealthUnavailable"
        "404":
          $ref: "#/components/responses/NotFound"
  /actuator/info:
    get:
      operationId: getApplicationInfo
      summary: Get safe application information
      description: Returns explicitly configured non-sensitive application metadata.
      tags:
        - Operations
      security: []
      responses:
        "200":
          description: Safe application information.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApplicationInfo"
        "404":
          $ref: "#/components/responses/NotFound"
  /livez:
    get:
      operationId: getAdditionalLiveness
      summary: Get short-form application liveness
      description: Alias used by infrastructure that expects a conventional liveness path.
      tags:
        - Operations
      security: []
      responses:
        "200":
          $ref: "#/components/responses/HealthUp"
        "503":
          $ref: "#/components/responses/HealthUnavailable"
        "404":
          $ref: "#/components/responses/NotFound"
  /readyz:
    get:
      operationId: getAdditionalReadiness
      summary: Get short-form application readiness
      description: Alias used by infrastructure that expects a conventional readiness path.
      tags:
        - Operations
      security: []
      responses:
        "200":
          $ref: "#/components/responses/HealthUp"
        "503":
          $ref: "#/components/responses/HealthUnavailable"
        "404":
          $ref: "#/components/responses/NotFound"
  /auth/register:
    post:
      operationId: registerUser
      summary: Register a pending user account
      description: |
        Accepts the current terms and creates a pending account when the
        normalized email is available. Eligible and duplicate addresses
        receive the same response to prevent account enumeration.
      tags:
        - Identity
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegistrationRequest"
      responses:
        "202":
          description: |
            The request was accepted without disclosing whether the email
            already exists.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RegistrationResponse"
        "400":
          description: The request or active consent version is invalid.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "413":
          description: The request exceeds the configured body limit.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /auth/email/verify:
    post:
      operationId: verifyEmail
      summary: Verify an email address with a single-use token
      description: |
        Consumes a valid, unexpired verification token and activates the
        pending account. Invalid, expired, and replayed tokens receive the
        same response.
      tags:
        - Identity
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmailVerificationRequest"
      responses:
        "204":
          description: The email address was verified.
        "400":
          description: The token is malformed, invalid, expired, or consumed.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "413":
          description: The request exceeds the configured body limit.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /auth/login:
    post:
      operationId: login
      summary: Authenticate an active account
      description: |
        Verifies the password with Argon2id and applies email and network
        risk limits. Unknown accounts, invalid passwords, and inactive
        accounts use the same generic authentication failure.
      tags:
        - Identity
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Authentication succeeded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "400":
          description: The request is malformed.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "401":
          description: The credentials or account state are invalid.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "429":
          description: Login risk limits were exceeded.
          headers:
            Retry-After:
              description: Seconds before the client should retry.
              schema:
                type: integer
                minimum: 1
                maximum: 86400
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "503":
          description: Risk controls are temporarily unavailable.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /auth/refresh:
    post:
      operationId: refreshSession
      summary: Rotate a refresh token family
      description: |
        Consumes the current refresh token and returns a new access and
        refresh token pair. Replaying a previously consumed token revokes
        the entire token family.
      tags:
        - Identity
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshSessionRequest"
      responses:
        "200":
          description: The refresh token was rotated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "400":
          description: The request is malformed.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "401":
          description: The token is invalid, expired, revoked, or replayed.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Access token issued by the GioiTruyen identity service.
  schemas:
    RegistrationRequest:
      type: object
      additionalProperties: false
      required:
        - email
        - password
        - acceptedTerms
        - consentVersion
      properties:
        email:
          type: string
          format: email
          maxLength: 254
        password:
          type: string
          format: password
          writeOnly: true
          minLength: 12
          maxLength: 128
        acceptedTerms:
          type: boolean
          const: true
        consentVersion:
          type: string
          pattern: '^[0-9]{4}-[0-9]{2}-[0-9]{2}$'
          example: "2026-07-24"
    RegistrationResponse:
      type: object
      additionalProperties: false
      required:
        - status
        - message
      properties:
        status:
          type: string
          const: PENDING_VERIFICATION
        message:
          type: string
          description: Generic response that does not reveal account existence.
    EmailVerificationRequest:
      type: object
      additionalProperties: false
      required:
        - token
      properties:
        token:
          type: string
          minLength: 1
          maxLength: 128
          pattern: '^[A-Za-z0-9._-]+$'
          writeOnly: true
    LoginRequest:
      type: object
      additionalProperties: false
      required:
        - email
        - password
      properties:
        email:
          type: string
          maxLength: 254
        password:
          type: string
          format: password
          writeOnly: true
          minLength: 1
          maxLength: 128
    LoginResponse:
      type: object
      additionalProperties: false
      required:
        - accessToken
        - tokenType
        - expiresIn
        - refreshToken
      properties:
        accessToken:
          type: string
          format: jwt
          minLength: 32
        tokenType:
          type: string
          const: Bearer
        expiresIn:
          type: integer
          minimum: 60
          maximum: 1800
        refreshToken:
          type: string
          minLength: 43
          maxLength: 128
    RefreshSessionRequest:
      type: object
      additionalProperties: false
      required:
        - refreshToken
      properties:
        refreshToken:
          type: string
          writeOnly: true
          minLength: 43
          maxLength: 128
          pattern: '^[A-Za-z0-9_-]+$'
    ApplicationInfo:
      type: object
      description: Allowlisted non-sensitive build and application metadata.
      additionalProperties: true
    Health:
      type: object
      description: Aggregate health response without component or topology details.
      additionalProperties: false
      required:
        - status
      properties:
        status:
          type: string
          description: Aggregate application status.
          enum:
            - UP
            - DOWN
            - OUT_OF_SERVICE
            - UNKNOWN
    Problem:
      type: object
      description: RFC 9457 problem detail response.
      additionalProperties: true
      required:
        - type
        - title
        - status
      properties:
        type:
          type: string
          format: uri-reference
        title:
          type: string
        status:
          type: integer
          minimum: 400
          maximum: 599
        detail:
          type: string
        instance:
          type: string
          format: uri-reference
  responses:
    HealthUp:
      description: The requested health group is available.
      content:
        application/vnd.spring-boot.actuator.v3+json:
          schema:
            $ref: "#/components/schemas/Health"
        application/json:
          schema:
            $ref: "#/components/schemas/Health"
    HealthUnavailable:
      description: The requested health group is unavailable.
      content:
        application/vnd.spring-boot.actuator.v3+json:
          schema:
            $ref: "#/components/schemas/Health"
        application/json:
          schema:
            $ref: "#/components/schemas/Health"
    NotFound:
      description: The requested endpoint is not exposed by this deployment.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
