        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: The idempotency key was reused for another request
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /teams/{teamId}/stories/{storyId}:
    get:
      operationId: getPublishingWorkspaceStory
      summary: Get a Team-owned story for the publishing workspace
      tags: [Publishing]
      parameters:
        - $ref: "#/components/parameters/TeamId"
        - name: storyId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Publishing story metadata and current version
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublishingStorySummary"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      operationId: updateStoryDraft
      summary: Update an editable Team story with optimistic concurrency
      description: |
        Requires story:edit. A successful conditional update creates the
        next immutable revision and returns its incremented version.
      tags: [Publishing]
      parameters:
        - $ref: "#/components/parameters/TeamId"
        - name: storyId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: If-Match
          in: header
          required: true
          schema:
            type: string
            pattern: '^"[1-9][0-9]*"$'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateStoryDraftRequest"
      responses:
        "200":
          description: Draft and immutable revision updated
          headers:
            ETag:
              schema:
                type: string
                pattern: '^"[1-9][0-9]*"$'
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TeamStoryDraft"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "412":
          description: If-Match version is stale
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /teams/{teamId}/stories/{storyId}/chapters:
    get:
      operationId: listPublishingWorkspaceChapters
      summary: List current chapter revisions for a Team-owned story
      tags: [Publishing]
      parameters:
        - $ref: "#/components/parameters/TeamId"
        - name: storyId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Chapters ordered by chapter number
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PublishingChapterEditor"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      operationId: createChapterDraft
      summary: Create a chapter draft and its immutable first revision
      description: |
        Requires an active Team, story:edit permission, and ownership of an
        editable story. HTML is normalized, size-limited, and sanitized with
        a strict allowlist before the immutable revision is persisted.
      tags: [Publishing]
      parameters:
        - $ref: "#/components/parameters/TeamId"
        - name: storyId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateChapterDraftRequest"
      responses:
        "201":
          description: Chapter draft and immutable revision created
          headers:
            Location:
              schema:
                type: string
            ETag:
              schema:
                type: string
                const: '"1"'
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TeamChapterDraft"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: The chapter number already exists in this story
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /teams/{teamId}/stories/{storyId}/chapters/{chapterId}:
    patch:
      operationId: updateChapterDraft
      summary: Autosave a chapter by creating its next immutable revision
      description: |
        Requires story:edit. If-Match performs compare-and-set against the
        current chapter version so concurrent browser sessions cannot overwrite
        each other.
      tags: [Publishing]
      parameters:
        - $ref: "#/components/parameters/TeamId"
        - name: storyId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: chapterId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: If-Match
          in: header
          required: true
          schema:
            type: string
            pattern: '^"[1-9][0-9]*"$'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateChapterDraftRequest"
      responses:
        "200":
          description: Chapter and immutable revision updated
          headers:
            ETag:
              schema:
                type: string
                pattern: '^"[1-9][0-9]*"$'
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TeamChapterDraft"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "412":
          description: If-Match chapter version is stale
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /teams/{teamId}/stories/{storyId}/submit:
    post:
      operationId: submitStoryForReview
      summary: Freeze current revisions and submit a story for review
      description: |
        Requires story:submit on the active owning Team. The current story
        revision and every current chapter revision are frozen into one
        idempotent review case. A compare-and-set transition prevents a stale
        revision from entering review.
      tags: [Publishing]
      parameters:
        - $ref: "#/components/parameters/TeamId"
        - name: storyId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "202":
          description: Revisions frozen; automated checks are pending
          headers:
            Location:
              schema:
                type: string
            ETag:
              schema:
                type: string
                const: '"1"'
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublishingSubmission"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: |
            Idempotency key reuse or a stale/concurrent story transition
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "422":
          description: The story is incomplete, including missing chapters
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /teams/{teamId}/stories/{storyId}/schedule:
    post:
      operationId: scheduleApprovedStory
      summary: Schedule an approved frozen revision for publication
      description: |
        Requires story:publish on the active owning Team. The approved story
        revision and its approved frozen chapter revisions are pinned in one
        transaction. publishAt is stored in UTC while the IANA time zone is
        retained for display and audit.
      tags: [Publishing]
      parameters:
        - $ref: "#/components/parameters/TeamId"
        - name: storyId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ScheduleStoryRequest"
      responses:
        "201":
          description: Approved revisions scheduled or safely replayed
          headers:
            Location:
              schema:
                type: string
            ETag:
              schema:
                type: string
                pattern: '^"[1-9][0-9]*"$'
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublishingSchedule"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Another active schedule or revision transition won
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
    patch:
      operationId: rescheduleApprovedStory
      summary: Reschedule a pinned approved revision
      tags: [Publishing]
      parameters:
        - $ref: "#/components/parameters/TeamId"
        - name: storyId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: If-Match
          in: header
          required: true
          schema:
            type: string
            pattern: '^"[1-9][0-9]*"$'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RescheduleStoryRequest"
      responses:
        "200":
          description: Schedule updated with optimistic concurrency
          headers:
            ETag:
              schema:
                type: string
                pattern: '^"[1-9][0-9]*"$'
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublishingSchedule"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "412":
          description: If-Match schedule version is stale
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
    delete:
      operationId: cancelStorySchedule
      summary: Cancel a schedule and restore its pinned revisions to approved
      tags: [Publishing]
      parameters:
        - $ref: "#/components/parameters/TeamId"
        - name: storyId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: If-Match
          in: header
          required: true
          schema:
            type: string
            pattern: '^"[1-9][0-9]*"$'
      responses:
        "204":
          description: Schedule cancelled
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "412":
          description: If-Match schedule version is stale
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /teams/{teamId}/stories/{storyId}/visibility:
    post:
      operationId: changeTeamStoryVisibility
      summary: Hide or reinstate a published Team story
      tags: [Publishing]
      parameters:
        - $ref: "#/components/parameters/TeamId"
        - name: storyId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: If-Match
          in: header
          required: true
          schema: { type: string, pattern: '^"[1-9][0-9]*"$' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ContentVisibilityRequest"
      responses:
        "200":
          description: Visibility changed atomically with audit and outbox
          headers:
            ETag:
              schema: { type: string, pattern: '^"[1-9][0-9]*"$' }
            Cache-Control:
              schema: { type: string, const: no-store }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContentVisibility"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: Visibility transition is not allowed
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "412":
          description: If-Match version is stale
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
  /moderation/stories/{storyId}/visibility:
    post:
      operationId: moderateStoryVisibility
      summary: Suspend or reinstate a published story
      tags: [Moderation]
      parameters:
        - name: storyId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: If-Match
          in: header
          required: true
          schema: { type: string, pattern: '^"[1-9][0-9]*"$' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ContentVisibilityRequest"
      responses:
        "200":
          description: Moderation visibility changed with immutable reason
          headers:
            ETag:
              schema: { type: string, pattern: '^"[1-9][0-9]*"$' }
            Cache-Control:
              schema: { type: string, const: no-store }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContentVisibility"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: Visibility transition is not allowed
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "412":
          description: If-Match version is stale
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
  /moderation/cases:
    get:
      operationId: listModerationCases
      summary: List the prioritized claimable publishing review queue
      description: |
        Requires Moderator or Admin. The HMAC-signed keyset cursor preserves
        priority-descending and oldest-first order. Private chapter content is
        not returned by this queue endpoint.
      tags: [Moderation]
      parameters:
        - name: type
          in: query
          schema:
            type: string
            const: PUBLISHING
            default: PUBLISHING
        - name: state
          in: query
          schema:
            type: string
            const: OPEN
            default: OPEN
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: cursor
          in: query
          schema:
            type: string
            maxLength: 512
      responses:
        "200":
          description: Prioritized claimable review cases
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ModerationReviewPage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /moderation/cases/{reviewId}:
    get:
      operationId: getModerationCaseEvidence
      summary: Read the immutable story and chapter evidence for a review
      description: |
        Requires Moderator or Admin. Only revisions frozen when the story was
        submitted are returned; the response is private and never cached.
      tags: [Moderation]
      parameters:
        - name: reviewId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Frozen review evidence
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ModerationReviewDetail"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      operationId: claimModerationCase
      summary: Atomically claim an open or lease-expired review case
      description: |
        Requires Moderator or Admin. If-Match and an atomic state/lease
        predicate guarantee that concurrent reviewers cannot both claim the
        same case.
      tags: [Moderation]
      parameters:
        - name: reviewId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: If-Match
          in: header
          required: true
          schema:
            type: string
            pattern: '^"[1-9][0-9]*"$'
      responses:
        "200":
          description: Review lease acquired
          headers:
            ETag:
              schema:
                type: string
                pattern: '^"[1-9][0-9]*"$'
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ModerationReviewCase"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: Review changed, is actively leased, or is no longer open
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /moderation/cases/{reviewId}/decisions:
    post:
      operationId: decideModerationCase
      summary: Decide a claimed publishing review exactly once
      description: |
        Requires Moderator or Admin and an active lease owned by the caller.
        The review, frozen story/chapter states, and immutable audit entry are
        committed in one transaction. The policy version and reason are
        retained with the decision.
      tags: [Moderation]
      parameters:
        - name: reviewId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: If-Match
          in: header
          required: true
          schema:
            type: string
            pattern: '^"[1-9][0-9]*"$'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ModerationDecisionRequest"
      responses:
        "200":
          description: Review decision committed exactly once
          headers:
            ETag:
              schema:
                type: string
                pattern: '^"[1-9][0-9]*"$'
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ModerationDecision"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: Review already decided, lease lost, or target stale
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Access token issued by the GioiTruyen identity service.
  parameters:
    StoryId:
      name: storyId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    TeamId:
      name: teamId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 8
        maxLength: 128
        pattern: "^[A-Za-z0-9][A-Za-z0-9._:-]+$"
  schemas:
    CreateStoryDraftRequest:
      type: object
      additionalProperties: false
      required:
        - title
        - synopsis
        - origin
        - language
        - categoryIds
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
        synopsis:
          type: string
          minLength: 1
          maxLength: 5000
        origin:
          type: string
          enum: [ORIGINAL, TRANSLATED]
        language:
          type: string
          minLength: 2
          maxLength: 16
          pattern: "^[a-z]{2,3}(?:-[A-Za-z0-9]{2,8})*$"
        categoryIds:
          type: array
          minItems: 1
          maxItems: 30
          uniqueItems: true
          items:
            type: string
            format: uuid
        coverAssetId:
          type: [string, "null"]
          format: uuid
    UpdateStoryDraftRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
        synopsis:
          type: string
          minLength: 1
          maxLength: 5000
        categoryIds:
          type: array
          minItems: 1
          maxItems: 30
          uniqueItems: true
          items:
            type: string
            format: uuid
        coverAssetId:
          type: string
          format: uuid
        completionStatus:
          type: string
          enum: [ONGOING, COMPLETED, HIATUS]
    CreateChapterDraftRequest:
      type: object
      additionalProperties: false
      required: [number, title, contentHtml]
      properties:
        number:
          type: integer
          minimum: 1
          maximum: 100000
        title:
          type: string
          minLength: 1
          maxLength: 200
        contentHtml:
          type: string
          minLength: 1
          maxLength: 1000000
          description: |
            UTF-8 HTML input. The server enforces a 1,000,000-byte,
            20,000-node, and 30,000-word limit and sanitizes it.
    UpdateChapterDraftRequest:
      type: object
      additionalProperties: false
      required: [title, contentHtml]
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
        contentHtml:
          type: string
          minLength: 1
          maxLength: 1000000
    PublishingStorySummary:
      allOf:
        - $ref: "#/components/schemas/TeamStoryDraft"
        - type: object
          required: [workflowStatus]
          properties:
            workflowStatus:
              type: string
              enum:
                - DRAFT
                - IN_REVIEW
                - CHANGES_REQUESTED
                - APPROVED
                - SCHEDULED
                - PUBLISHED
                - HIDDEN
                - SUSPENDED
    PublishingChapterEditor:
      allOf:
        - $ref: "#/components/schemas/TeamChapterDraft"
        - type: object
          required: [contentHtml]
          properties:
            contentHtml:
              type: string
              maxLength: 1000000
    TeamStoryDraft:
      type: object
      additionalProperties: false
      required:
        - id
        - teamId
        - slug
        - title
        - synopsis
        - origin
        - language
        - categoryIds
        - completionStatus
        - workflowStatus
        - currentRevision
        - revisionNo
        - version
        - updatedAt
      properties:
        id:
          type: string
          format: uuid
        teamId:
          type: string
          format: uuid
        slug:
          type: string
          pattern: "^[a-z0-9]+(?:-[a-z0-9]+)*$"
          maxLength: 100
        title:
          type: string
          maxLength: 200
        synopsis:
          type: string
          maxLength: 5000
        origin:
          type: string
          enum: [ORIGINAL, TRANSLATED]
        language:
          type: string
          maxLength: 16
        categoryIds:
          type: array
          maxItems: 30
          uniqueItems: true
          items:
            type: string
