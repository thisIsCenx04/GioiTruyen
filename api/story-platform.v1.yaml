  /reading-sessions/{sessionId}/heartbeats:
    post:
      operationId: ingestReadingHeartbeats
      summary: Ingest a contiguous, replay-safe heartbeat batch
      description: |
        Batch IDs and sequence numbers make retries idempotent. Accepted
        batches are emitted through the transactional outbox; this endpoint
        never increments public view counters directly.
      security: []
      tags: [Reading]
      parameters:
        - name: sessionId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: X-Reading-Session-Token
          in: header
          required: true
          schema:
            type: string
            minLength: 80
            maxLength: 1024
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReadingHeartbeatBatch"
      responses:
        "202":
          description: Batch accepted or safely recognized as a replay
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadingHeartbeatReceipt"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
  /reading-sessions/{sessionId}/complete:
    post:
      operationId: completeReadingSession
      summary: Idempotently queue a reading session for completion
      description: |
        A successful request only transitions the session to
        COMPLETION_PENDING and emits a transactional outbox event. View
        qualification and counters are processed asynchronously.
      security: []
      tags: [Reading]
      parameters:
        - name: sessionId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: X-Reading-Session-Token
          in: header
          required: true
