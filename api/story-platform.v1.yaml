openapi: 3.1.0
info:
  title: GioiTruyen Story Platform API
  version: 1.0.0
  description: |
    Public HTTP contract for the GioiTruyen platform. This contract grows
    incrementally with each implemented vertical slice.
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
servers:
  - url: /api/v1
    description: Application context path
tags:
  - name: Operations
    description: Safe operational probes exposed to load balancers and orchestrators.
  - name: Identity
    description: Public account registration and identity lifecycle operations.
  - name: Profiles
    description: Private account details and allowlisted public profile fields.
  - name: Teams
    description: Public team profiles and owner-managed settings.
  - name: Catalog
    description: Public story metadata and grouped discovery taxonomy.
  - name: Media
    description: Restricted direct-upload grants and asset processing.
  - name: Publishing
    description: Team-owned story and chapter authoring workflows.
  - name: Reading
    description: Public revisioned chapter reading operations.
  - name: Community
    description: Reader relations and safety-bounded discussion operations.
security:
  - bearerAuth: []
paths:
  /actuator/health:
    get:
      operationId: getAggregateHealth
      summary: Get aggregate application health
      description: Returns only the aggregate status and never dependency details.
      tags:
        - Operations
      security: []
      responses:
        "200":
          $ref: "#/components/responses/HealthUp"
        "503":
          $ref: "#/components/responses/HealthUnavailable"
        "404":
          $ref: "#/components/responses/NotFound"
  /actuator/health/liveness:
    get:
      operationId: getLiveness
      summary: Get application liveness
      description: Reports whether the process is internally able to continue running.
      tags:
        - Operations
      security: []
      responses:
        "200":
          $ref: "#/components/responses/HealthUp"
        "503":
          $ref: "#/components/responses/HealthUnavailable"
        "404":
          $ref: "#/components/responses/NotFound"
  /actuator/health/readiness:
    get:
      operationId: getReadiness
      summary: Get application readiness
      description: Reports whether the application and required data stores can serve traffic.
      tags:
        - Operations
      security: []
      responses:
        "200":
          $ref: "#/components/responses/HealthUp"
        "503":
          $ref: "#/components/responses/HealthUnavailable"
        "404":
          $ref: "#/components/responses/NotFound"
  /actuator/info:
    get:
      operationId: getApplicationInfo
      summary: Get safe application information
      description: Returns explicitly configured non-sensitive application metadata.
      tags:
        - Operations
      security: []
      responses:
        "200":
          description: Safe application information.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApplicationInfo"
        "404":
          $ref: "#/components/responses/NotFound"
  /livez:
    get:
      operationId: getAdditionalLiveness
      summary: Get short-form application liveness
      description: Alias used by infrastructure that expects a conventional liveness path.
      tags:
        - Operations
      security: []
      responses:
        "200":
          $ref: "#/components/responses/HealthUp"
        "503":
          $ref: "#/components/responses/HealthUnavailable"
        "404":
          $ref: "#/components/responses/NotFound"
  /readyz:
    get:
      operationId: getAdditionalReadiness
      summary: Get short-form application readiness
      description: Alias used by infrastructure that expects a conventional readiness path.
      tags:
        - Operations
      security: []
      responses:
        "200":
          $ref: "#/components/responses/HealthUp"
        "503":
          $ref: "#/components/responses/HealthUnavailable"
        "404":
          $ref: "#/components/responses/NotFound"
  /auth/register:
    post:
      operationId: registerUser
      summary: Register a pending user account
      description: |
        Accepts the current terms and creates a pending account when the
        normalized email is available. Eligible and duplicate addresses
        receive the same response to prevent account enumeration.
      tags:
        - Identity
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegistrationRequest"
      responses:
        "202":
          description: |
            The request was accepted without disclosing whether the email
            already exists.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RegistrationResponse"
        "400":
          description: The request or active consent version is invalid.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "413":
          description: The request exceeds the configured body limit.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /auth/email/verify:
    post:
      operationId: verifyEmail
      summary: Verify an email address with a single-use token
      description: |
        Consumes a valid, unexpired verification token and activates the
        pending account. Invalid, expired, and replayed tokens receive the
        same response.
      tags:
        - Identity
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmailVerificationRequest"
      responses:
        "204":
          description: The email address was verified.
        "400":
          description: The token is malformed, invalid, expired, or consumed.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "413":
          description: The request exceeds the configured body limit.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /auth/login:
    post:
      operationId: login
      summary: Authenticate an active account
      description: |
        Verifies the password with Argon2id and applies email and network
        risk limits. Unknown accounts, invalid passwords, and inactive
        accounts use the same generic authentication failure.
      tags:
        - Identity
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Authentication succeeded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "400":
          description: The request is malformed.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "401":
          description: Credentials, MFA code, or account state are invalid.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "403":
          description: A privileged account must enroll MFA before login.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "429":
          description: Login risk limits were exceeded.
          headers:
            Retry-After:
              description: Seconds before the client should retry.
              schema:
                type: integer
                minimum: 1
                maximum: 86400
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "503":
          description: Risk controls are temporarily unavailable.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /auth/refresh:
    post:
      operationId: refreshSession
      summary: Rotate a refresh token family
      description: |
        Consumes the current refresh token and returns a new access and
        refresh token pair. Replaying a previously consumed token revokes
        the entire token family.
      tags:
        - Identity
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshSessionRequest"
      responses:
        "200":
          description: The refresh token was rotated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "400":
          description: The request is malformed.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "401":
          description: The token is invalid, expired, revoked, or replayed.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /auth/mfa/challenge:
    post:
      operationId: beginMfaEnrollment
      summary: Start encrypted TOTP enrollment
      description: |
        Replaces any unverified enrollment and returns a provisioning secret
        once. The server stores only an AES-GCM protected form.
      tags:
        - Identity
      responses:
        "200":
          description: TOTP enrollment challenge created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MfaChallengeResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          description: MFA is already enabled and cannot be replaced here.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /auth/mfa/verify:
    post:
      operationId: verifyMfaEnrollment
      summary: Activate TOTP and issue one-time recovery codes
      description: |
        Activates the pending factor, increments the account security version,
        and revokes all existing sessions. Recovery codes are returned once.
      tags:
        - Identity
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MfaVerificationRequest"
      responses:
        "200":
          description: MFA activated; recovery codes must be stored securely.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MfaActivationResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          description: MFA verification attempts exceeded the risk limit.
          headers:
            Retry-After:
              schema:
                type: integer
                minimum: 1
                maximum: 86400
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "503":
          description: MFA risk controls are temporarily unavailable.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /auth/password/forgot:
    post:
      operationId: requestPasswordReset
      summary: Request a password reset without account disclosure
      description: |
        Always returns the same accepted response. When an active account
        exists, a hashed, expiring, single-use token is queued for delivery.
      tags:
        - Identity
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ForgotPasswordRequest"
      responses:
        "202":
          description: The request was accepted without disclosing account state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PasswordResetAccepted"
        "400":
          $ref: "#/components/responses/BadRequest"
  /auth/password/reset:
    post:
      operationId: resetPassword
      summary: Consume a single-use password reset token
      description: |
        Replaces the Argon2id password, increments the security version, and
        revokes every existing session atomically.
      tags:
        - Identity
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResetPasswordRequest"
      responses:
        "204":
          description: Password reset and session revocation completed.
        "400":
          $ref: "#/components/responses/BadRequest"
  /auth/reauth/grants:
    post:
      operationId: issueReauthenticationGrant
      summary: Issue a single-use scoped reauthentication grant
      description: |
        Verifies the current password and applicable MFA proof, then issues an
        opaque short-lived grant bound to actor, scope, target type, and target
        ID. Downstream sensitive actions must consume it atomically.
      tags:
        - Identity
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReauthenticationGrantRequest"
      responses:
        "200":
          description: Scoped reauthentication grant issued.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReauthenticationGrantResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          description: Reauthentication attempts exceeded the risk limit.
          headers:
            Retry-After:
              schema:
                type: integer
                minimum: 1
                maximum: 86400
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "503":
          description: Reauthentication risk controls are unavailable.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /auth/logout:
    post:
      operationId: logout
      summary: Revoke the current session
      tags:
        - Identity
      responses:
        "204":
          description: The current session is revoked or already inactive.
        "401":
          description: The access token or session is invalid.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /auth/sessions:
    get:
      operationId: listSessions
      summary: List active sessions with minimal masked metadata
      tags:
        - Identity
      responses:
        "200":
          description: Active sessions ordered by recent activity.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionListResponse"
        "401":
          description: The access token or session is invalid.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
    delete:
      operationId: revokeAllSessions
      summary: Revoke all active sessions
      tags:
        - Identity
      responses:
        "204":
          description: All owned sessions are revoked.
        "401":
          description: The access token or session is invalid.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /auth/sessions/{sessionId}:
    delete:
      operationId: revokeSession
      summary: Revoke one owned session
      tags:
        - Identity
      parameters:
        - name: sessionId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: The owned session is revoked or already inactive.
        "400":
          description: The session identifier is malformed.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "401":
          description: The access token or session is invalid.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /me:
    get:
      operationId: getPrivateProfile
      summary: Get the authenticated user's private profile
      tags: [Profiles]
      responses:
        "200":
          description: Private owner-only profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PrivateProfile"
        "401":
          $ref: "#/components/responses/Unauthorized"
    patch:
      operationId: updatePrivateProfile
      summary: Update profile fields with optimistic concurrency
      tags: [Profiles]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateProfileRequest"
      responses:
        "200":
          description: Updated private profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PrivateProfile"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          description: The supplied profile version is stale
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /users/{userId}:
    get:
      operationId: getPublicProfile
      summary: Get an allowlisted public profile
      security: []
      tags: [Profiles]
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Public profile without identity or security fields
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicProfile"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
  /categories:
    get:
      operationId: getCategoryTaxonomy
      summary: Get the versioned category taxonomy grouped by discovery axis
      security: []
      tags: [Catalog]
      responses:
        "200":
          description: All active categories in a stable group and item order
          headers:
            Cache-Control:
              schema:
                type: string
              description: Public browser and edge cache policy.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Taxonomy"
        "429":
          description: Public catalog request limits were exceeded.
          headers:
            Retry-After:
              description: Seconds before the client should retry.
              schema:
                type: integer
                minimum: 1
  /stories:
    get:
      operationId: listPublishedStories
      summary: List published stories with bounded filters and signed keyset pagination
      security: []
      tags: [Catalog]
      parameters:
        - name: category
          in: query
          description: Comma-separated active category slugs, at most 10.
          schema:
            type: string
            maxLength: 800
        - name: status
          in: query
          schema:
            type: string
            enum: [ongoing, completed, hiatus]
        - name: origin
          in: query
          schema:
            type: string
            enum: [original, translated]
        - name: teamId
          in: query
          schema:
            type: string
            format: uuid
        - name: sort
          in: query
          schema:
            type: string
            enum: [updated_desc, published_desc]
            default: published_desc
        - name: cursor
          in: query
          schema:
            type: string
            maxLength: 512
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 20
      responses:
        "200":
          description: Published story page.
          headers:
            Cache-Control:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicStoryPage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "429":
          description: Public catalog request limits were exceeded.
  /home:
    get:
      operationId: getHome
      summary: Get the current versioned public home read model
      description: |
        Returns bounded, precomputed sections. Empty specialized sections
        fall back to the latest published stories.
      security: []
      tags: [Catalog]
      parameters:
        - name: locale
          in: query
          schema:
            type: string
            pattern: "^[a-z]{2}(?:-[A-Z]{2})?$"
            maxLength: 5
            default: vi-VN
        - name: If-None-Match
          in: header
          schema:
            type: string
      responses:
        "200":
          description: Current home read model.
          headers:
            ETag:
              schema:
                type: string
            Cache-Control:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HomeResponse"
        "304":
          description: The supplied ETag represents the current version.
        "400":
          $ref: "#/components/responses/BadRequest"
  /search:
    get:
      operationId: searchPublishedStories
      summary: Search published stories with highlights and facets
      description: |
        Uses Atlas Search when enabled and a bounded MongoDB text-index
        fallback otherwise. Raw regex and MongoDB operators are never accepted.
      security: []
      tags: [Catalog]
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
            minLength: 2
            maxLength: 200
        - name: categoryId
          in: query
          schema:
            type: string
            format: uuid
        - name: status
          in: query
          schema:
            type: string
            enum: [ongoing, completed, hiatus]
        - name: origin
          in: query
          schema:
            type: string
            enum: [original, translated]
        - name: cursor
          in: query
          schema:
            type: string
            maxLength: 2048
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 20
      responses:
        "200":
          description: Ranked published story search results.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SearchResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
  /search/suggestions:
    get:
      operationId: suggestPublishedStories
      summary: Get bounded Atlas autocomplete suggestions
      description: |
        Rate limited to 30 requests per minute per opaque client
        fingerprint. Text fallback never uses regex and returns no suggestions.
      security: []
      tags: [Catalog]
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
            minLength: 2
            maxLength: 80
        - name: cursor
          in: query
          schema:
            type: string
            maxLength: 2048
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 10
            default: 8
      responses:
        "200":
          description: Published story title suggestions.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuggestionResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "429":
          description: Suggestion request rate limit exceeded.
          headers:
            Retry-After:
              schema:
                type: integer
                minimum: 1
        "503":
          description: Abuse protection is unavailable; request fails closed.
  /stories/{idOrSlug}:
    get:
      operationId: getPublishedStory
      summary: Get one published story by UUID or globally unique slug
      security: []
      tags: [Catalog]
      parameters:
        - name: idOrSlug
          in: path
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 100
        - name: If-None-Match
          in: header
          schema:
            type: string
      responses:
        "200":
          description: Published story metadata.
          headers:
            ETag:
              schema:
                type: string
            Cache-Control:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicStory"
        "304":
          description: The supplied ETag still represents the current version.
        "404":
          $ref: "#/components/responses/NotFound"
  /stories/{idOrSlug}/chapters:
    get:
      operationId: listPublishedChapters
      summary: List published chapter summaries with signed keyset pagination
      description: |
        Returns public metadata only. Draft, scheduled, hidden, and archived
        chapters and revision content are never exposed by this endpoint.
      security: []
      tags: [Catalog]
      parameters:
        - name: idOrSlug
          in: path
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 100
        - name: cursor
          in: query
          schema:
            type: string
            maxLength: 512
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        "200":
          description: Published chapter page ordered by chapter number.
          headers:
            Cache-Control:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicChapterPage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
  /chapters/{chapterId}:
    get:
      operationId: getPublishedChapter
      summary: Read one immutable published chapter revision
      description: |
        Returns the exact sanitized revision referenced by the published
        chapter. Hidden chapters, hidden stories, and missing revision
        evidence all produce the same not-found response.
      security: []
      tags: [Reading]
      parameters:
        - name: chapterId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: If-None-Match
          in: header
          schema:
            type: string
            pattern: '^"[0-9a-f]{64}"$'
      responses:
        "200":
          description: Published chapter content and adjacent navigation
          headers:
            ETag:
              schema:
                type: string
                pattern: '^"[0-9a-f]{64}"$'
            Cache-Control:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublishedChapterDetail"
        "304":
          description: The supplied revision ETag is still current
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
  /reading-sessions:
    post:
      operationId: startReadingSession
      summary: Start a signed, privacy-bounded reading session
      description: |
        Supports authenticated and anonymous readers. Anonymous callers must
        provide a device-local random UUID. Raw user, anonymous and network
        identifiers are never stored in the reading session.
      security:
        - {}
        - bearerAuth: []
      tags: [Reading]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StartReadingSessionRequest"
      responses:
        "201":
          description: Short-lived session grant for heartbeat ingestion
          headers:
            Location:
              schema:
                type: string
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadingSessionGrant"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          description: Reading session start quota exceeded
          headers:
            Retry-After:
              schema:
                type: integer
                minimum: 1
          content:
