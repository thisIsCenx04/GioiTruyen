          pattern: "^[0-9a-f]{64}$"
          description: Lowercase SHA-256 digest computed before upload.
    UploadSignatureGrant:
      type: object
      additionalProperties: false
      required:
        - intentId
        - uploadUrl
        - apiKey
        - signature
        - expiresAt
        - maximumBytes
        - allowedContentTypes
        - parameters
      properties:
        intentId:
          type: string
          format: uuid
