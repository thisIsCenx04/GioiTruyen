          type: string
          format: date-time
        maximumBytes:
          type: integer
          format: int64
          minimum: 1
        allowedContentTypes:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            type: string
            enum: [image/jpeg, image/png, image/webp]
        parameters:
          type: object
          description: Exact immutable parameter set covered by the signature.
          additionalProperties:
            type: string
